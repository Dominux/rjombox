[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
tokio = {version = "1.49.0", features = ['rt-multi-thread']}
tower-http = { version = "0.6.8", features = ["cors"], optional = true }

# errors
thiserror = "2.0.18"

# logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"]}

[features]
dev = ["dep:tower-http"]
